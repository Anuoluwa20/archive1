  <!-- 02 behaviour -->
  <text x="80" y="550" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#8B857B">02 — MARK BEHAVIOUR · SIZE LADDER AND DENSITY STATES</text>
  <text x="80" y="574" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">Every state a mark is allowed to take. The weave is shown because it is the most fragile of the four.</text>

  <text x="80" y="616" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="2" fill="#8B857B">SIZE LADDER · 64 / 40 / 24 / 14 PX</text>

