  <text x="353" y="740" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">14</text>

  <text x="480" y="660" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">At 14 px the weave closes up and reads as a grey block.</text>
  <text x="480" y="684" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">That is the failure state. The mark is then redrawn with wider</text>
  <text x="480" y="708" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">gaps rather than shipped as mush. Never faked with a blur.</text>

  <text x="80" y="790" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="2" fill="#8B857B">DENSITY STATES · SOLID / SCREEN / SOFT / OUTLINE</text>

