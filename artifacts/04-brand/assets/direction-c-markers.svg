  <text x="300" y="1186" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="1.4" fill="#8B857B">ORDER 01 — DENSE</text>
  <text x="780" y="1186" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="1.4" fill="#8B857B">ORDER 02 — SPARSE</text>
  <text x="1260" y="1186" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="1.4" fill="#8B857B">ORDER 03 — TRANSMISSION</text>

  <line x1="80" y1="1210" x2="1520" y2="1210" stroke="#2A2E36" stroke-width="1"/>

  <!-- 04 the guard -->
  <text x="80" y="1250" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#8B857B">04 — THE BINDING GUARD · PRINTED ON THE SHEET, NOT BURIED IN THE GUIDELINES</text>
  <rect x="80" y="1268" width="1440" height="176" fill="#0D0F14" stroke="#E0523B" stroke-width="1"/>
  <text x="110" y="1302" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#E9E5DC">ANY MARK THAT CARRIES A MEANING MUST STATE ITS SOURCE, ITS PEOPLE AND ITS LIVING DESCENDANTS ON THE PAGE.</text>
  <text x="110" y="1326" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#E0523B">OTHERWISE IT IS CAPTIONED:  [FORMAL MARK — NO DOCUMENTED MEANING CLAIMED]</text>
  <text x="110" y="1362" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">The four marks on this sheet are formal. They claim nothing. Nothing here reproduces nsibidi, uli or any documented Nigerian sign system.</text>
  <text x="110" y="1386" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">Nsibidi is cited, not used: "a system of symbols or proto-writing developed by the Ejagham people in the cross river region of Nigeria",</text>
  <text x="110" y="1410" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">circa 400 AD – present, with documented descendant systems Anaforuana (Cuba) and Veve (Haiti). Source: https://en.wikipedia.org/wiki/Nsibidi</text>
  <text x="110" y="1434" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">Using a living, meaning-bearing sign system as interface furniture is the exact failure mode this guard exists to prevent.</text>

  <line x1="80" y1="1466" x2="1520" y2="1466" stroke="#2A2E36" stroke-width="1"/>
  <text x="80" y="1496" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">Specimen, not final artwork. Structure and behaviour only — no archival imagery, no gradients, no green, no discipline colour.</text>
</svg>
