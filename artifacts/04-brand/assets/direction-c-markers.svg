<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1540" width="1600" height="1540" role="img" aria-labelledby="tC2 dC2">
  <title id="tC2">ARCHIVE — Direction C, The Signal: marker system</title>
  <desc id="dC2">Marker specimen sheet. Shows four proposed discipline marks drawn as abstract geometry for this sheet alone, their size ladder from sixty-four to fourteen pixels, their four ink densities, a demonstration of the same marks re-ordered into three arrangements, and the binding guard that governs any meaning-bearing mark. The four marks are formal: they are not reproductions of nsibidi, uli or any documented Nigerian sign system, and they claim no meaning. Structure and behaviour only, not final artwork. No archival imagery, no gradients, no green.</desc>

  <defs>
    <pattern id="cDs60" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="2" cy="2" r="1.72" fill="#E9E5DC"/>
    </pattern>
    <pattern id="cDs30" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1.9" fill="#E9E5DC"/>
    </pattern>
  </defs>

  <rect width="1600" height="1540" fill="#0D0F14"/>

  <text x="80" y="68" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#E9E5DC">DIRECTION C — THE SIGNAL · MARKERS</text>
  <text x="80" y="96" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="13" fill="#8B857B">Four proposed discipline marks, their states, their re-ordering, and the guard that governs them. Structure and behaviour only.</text>
  <line x1="80" y1="118" x2="1520" y2="118" stroke="#2A2E36" stroke-width="1"/>

  <!-- 01 the four marks -->
  <text x="80" y="170" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#8B857B">01 — THE FOUR DISCIPLINE MARKS · A PROPOSED MARKER VOCABULARY · DRAWN AS PURE GEOMETRY</text>
  <text x="80" y="194" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">These four forms were drawn for this sheet. They reproduce no sign system, documentary or living, and they carry no claimed meaning.</text>

