  <text x="138" y="890" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">100% SOLID</text>
  <text x="288" y="890" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">60% SCREEN</text>
  <text x="438" y="890" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">30% SOFT</text>
  <text x="588" y="890" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">0% OUTLINE</text>

  <text x="700" y="836" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">The same rule as the wordmark: a mark is never identified by colour.</text>
  <text x="700" y="860" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">Era is the only thing that changes its density. One ink, four states.</text>

  <line x1="80" y1="910" x2="1520" y2="910" stroke="#2A2E36" stroke-width="1"/>

  <!-- 03 re-ordering -->
  <text x="80" y="950" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#8B857B">03 — RE-ORDERING · THE SAME VOCABULARY, A NEW ARRANGEMENT · THE ULI PRINCIPLE</text>
  <text x="80" y="974" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">Cited: "The motifs and symbols in Uli usually remain consistent however, it is the ordering of the design elements that challenge</text>
  <text x="80" y="992" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">the ingenuity of traditional artists" — https://en.wikipedia.org/wiki/Uche_Okeke. A fixed vocabulary, re-ordered: that is the mechanic.</text>

