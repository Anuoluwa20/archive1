<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500" role="img" aria-labelledby="tC1 dC1">
  <title id="tC1">ARCHIVE — Direction C, The Signal: wordmark specimen</title>
  <desc id="dC1">Specimen sheet for one of three creative directions. Shows the ARCHIVE lockup with its construction notes, the 1856 to 2026 time axis with four discipline lanes carrying dated marks, the four dot-screen density states of the wordmark, and the three era registers with the single signal-oxide accent. Structure and behaviour only, not final artwork. Set in system font stacks; the production faces are Archivo, Space Grotesk, Space Mono and Charis, all under the SIL Open Font License. Colour is dot-screen density on one ink, not hue. No archival imagery is used, and no gradients appear anywhere.</desc>

  <defs>
    <pattern id="ds60" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="2" cy="2" r="1.72" fill="#E9E5DC"/>
    </pattern>
    <pattern id="ds30" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1.9" fill="#E9E5DC"/>
    </pattern>
    <pattern id="weave" patternUnits="userSpaceOnUse" width="7" height="6">
      <line x1="0.5" y1="0" x2="0.5" y2="6" stroke="#E9E5DC" stroke-width="1.6"/>
    </pattern>
  </defs>

  <rect width="1600" height="1500" fill="#0D0F14"/>

  <text x="80" y="68" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#E9E5DC">DIRECTION C — THE SIGNAL</text>
  <text x="80" y="96" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="13" fill="#8B857B">Wordmark specimen — structure and behaviour only. Production faces: Archivo · Space Grotesk · Space Mono · Charis (all SIL OFL 1.1). Shown in system stacks.</text>
  <line x1="80" y1="118" x2="1520" y2="118" stroke="#2A2E36" stroke-width="1"/>

  <!-- 01 primary lockup -->
  <text x="80" y="170" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#8B857B">01 — PRIMARY LOCKUP · ONE INK · THE WORDMARK IS THE WHOLE IDENTITY</text>
  <text x="80" y="194" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">No symbol. The mark is the word, and the word's density is the system.</text>

  <rect x="80" y="220" width="900" height="272" fill="#0D0F14" stroke="#2A2E36" stroke-width="1"/>
  <text x="126" y="380" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="124" font-weight="700" letter-spacing="8" fill="#E9E5DC">ARCHIVE</text>
  <text x="126" y="428" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="13" letter-spacing="2.6" fill="#8B857B">A DIGITAL MUSEUM OF NIGERIA'S CREATIVE HISTORY</text>
  <text x="126" y="462" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">WIDTH AXIS: EXTRACONDENSED AT THE SECTION HEAD, EXPANDED AT THE MASTHEAD.</text>

  <rect x="1010" y="220" width="510" height="272" fill="#0D0F14" stroke="#2A2E36" stroke-width="1"/>
  <text x="1050" y="252" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="2" fill="#8B857B">CONSTRUCTION</text>
  <text x="1090" y="380" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="4" fill="none" stroke="#E9E5DC" stroke-width="0.9">ARCHIVE</text>
  <line x1="1070" y1="334" x2="1490" y2="334" stroke="#2A2E36" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="1070" y1="380" x2="1490" y2="380" stroke="#E0523B" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="1050" y="426" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">CAP HEIGHT — SHARED WITH THE AXIS RULE.</text>
  <text x="1050" y="446" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">BASELINE — THE LINE ALL FOUR LANES SIT ON.</text>
  <text x="1050" y="466" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">OUTLINE = THE MARK AT ZERO DENSITY.</text>

  <text x="80" y="512" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">THE WORD IS NEVER ROTATED, OUTLINED-AND-FILLED AT ONCE, OR PLACED ON AN IMAGE. IT SITS ON ITS OWN GROUND.</text>
  <line x1="80" y1="528" x2="1520" y2="528" stroke="#2A2E36" stroke-width="1"/>

  <!-- 02 the axis -->
  <text x="80" y="572" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#8B857B">02 — THE AXIS · 1856 → 2026 · FOUR LANES · TIME IS THE LAYOUT, NOT A SECTION</text>
  <text x="80" y="596" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">Time runs horizontally across all four lanes, so 1958, 1961, 1968 and 1977 line up vertically. These guides are time, not decoration.</text>

  <text x="1022" y="640" text-anchor="end" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="9" letter-spacing="1.2" fill="#8B857B">1958 · ZARIA ART SOCIETY</text>
  <text x="1178" y="640" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="9" letter-spacing="1.2" fill="#8B857B">1977 · FESTAC '77 — TWO LANES ALIGN</text>

  <line x1="1032" y1="664" x2="1032" y2="840" stroke="#E9E5DC" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="1168" y1="664" x2="1168" y2="840" stroke="#E9E5DC" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- lane 1 photography -->
  <text x="80" y="680" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#8B857B">01</text>
  <text x="280" y="680" text-anchor="end" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#E9E5DC">PHOTOGRAPHY</text>
  <line x1="300" y1="676" x2="1520" y2="676" stroke="#2A2E36" stroke-width="1"/>
  <circle cx="300" cy="676" r="5" fill="#E9E5DC"/>
  <circle cx="616" cy="676" r="5" fill="#E9E5DC"/>
  <circle cx="831" cy="676" r="5" fill="#E9E5DC"/>
  <circle cx="1104" cy="676" r="5" fill="#E9E5DC"/>
  <circle cx="1427" cy="676" r="5" fill="#E9E5DC"/>

  <!-- lane 2 music -->
  <text x="80" y="730" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#8B857B">02</text>
  <text x="280" y="730" text-anchor="end" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#E9E5DC">MUSIC</text>
  <line x1="300" y1="726" x2="1520" y2="726" stroke="#2A2E36" stroke-width="1"/>
  <rect x="1080.5" y="716" width="3" height="20" fill="#E9E5DC"/>
  <rect x="1166.5" y="716" width="3" height="20" fill="#E9E5DC"/>
  <rect x="1202.5" y="716" width="3" height="20" fill="#E9E5DC"/>

  <!-- lane 3 fashion -->
  <text x="80" y="780" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#8B857B">03</text>
  <text x="280" y="780" text-anchor="end" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#E9E5DC">FASHION</text>
  <line x1="300" y1="776" x2="1520" y2="776" stroke="#2A2E36" stroke-width="1"/>
  <rect x="300" y="773" width="1220" height="6" fill="url(#weave)"/>
  <circle cx="1168" cy="776" r="5" fill="#E9E5DC"/>

  <!-- lane 4 design -->
  <text x="80" y="830" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#8B857B">04</text>
  <text x="280" y="830" text-anchor="end" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#E9E5DC">DESIGN</text>
  <line x1="300" y1="826" x2="1520" y2="826" stroke="#2A2E36" stroke-width="1"/>
  <rect x="1026.5" y="820.5" width="11" height="11" fill="#E9E5DC"/>
  <rect x="1047.5" y="820.5" width="11" height="11" fill="#E9E5DC"/>
  <rect x="1133.5" y="820.5" width="11" height="11" fill="#E9E5DC"/>
  <rect x="1162.5" y="820.5" width="11" height="11" fill="#E9E5DC"/>

  <!-- axis -->
  <line x1="300" y1="868" x2="1520" y2="868" stroke="#8B857B" stroke-width="1"/>
  <line x1="300" y1="860" x2="300" y2="876" stroke="#8B857B" stroke-width="1"/>
  <line x1="1032" y1="860" x2="1032" y2="876" stroke="#8B857B" stroke-width="1"/>
  <line x1="1168" y1="860" x2="1168" y2="876" stroke="#8B857B" stroke-width="1"/>
  <line x1="1520" y1="860" x2="1520" y2="876" stroke="#8B857B" stroke-width="1"/>
  <text x="300" y="892" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">1856</text>
  <text x="1032" y="892" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">1958</text>
  <text x="1168" y="892" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">1977</text>
  <text x="1520" y="892" text-anchor="end" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">2026</text>

  <line x1="1480" y1="868" x2="1520" y2="868" stroke="#E0523B" stroke-width="3"/>
  <circle cx="1520" cy="868" r="5" fill="#E0523B"/>
  <text x="1472" y="846" text-anchor="end" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="1.2" fill="#E0523B">THE PRESENT</text>

  <text x="80" y="916" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">LANES: PHOTOGRAPHY — CONTACT STRIP · MUSIC — FREQUENCY · FASHION — WEAVE · DESIGN — GRID.  MOBILE AND REDUCED-MOTION GET A VERTICAL AXIS WITH A STICKY RAIL.</text>
  <line x1="80" y1="946" x2="1520" y2="946" stroke="#2A2E36" stroke-width="1"/>

  <!-- 03 dot screen states -->
  <text x="80" y="986" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#8B857B">03 — THE FOUR REGISTERED STATES · ONE INK AT FOUR DOT DENSITIES · FOUR STATES, NO MORE</text>
  <text x="80" y="1010" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">The density is not a mood. It is the era the wordmark is standing in — the past is lower resolution, the present is solid.</text>

  <text x="80" y="1044" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="2" fill="#8B857B">100% · SOLID</text>
  <rect x="80" y="1056" width="340" height="74" fill="#0D0F14" stroke="#2A2E36" stroke-width="1"/>
  <text x="100" y="1106" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="2" fill="#E9E5DC">ARCHIVE</text>
  <text x="80" y="1154" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">the present — full ink</text>

  <text x="440" y="1044" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="2" fill="#8B857B">60% · SCREEN</text>
  <rect x="440" y="1056" width="340" height="74" fill="#0D0F14" stroke="#2A2E36" stroke-width="1"/>
  <text x="460" y="1106" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="2" fill="url(#ds60)">ARCHIVE</text>
  <text x="440" y="1154" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">the recent past</text>

  <text x="800" y="1044" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="2" fill="#8B857B">30% · SOFT</text>
  <rect x="800" y="1056" width="340" height="74" fill="#0D0F14" stroke="#2A2E36" stroke-width="1"/>
  <text x="820" y="1106" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="2" fill="url(#ds30)">ARCHIVE</text>
  <text x="800" y="1154" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">the further past</text>

  <text x="1160" y="1044" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="2" fill="#8B857B">0% · OUTLINE</text>
  <rect x="1160" y="1056" width="340" height="74" fill="#0D0F14" stroke="#2A2E36" stroke-width="1"/>
  <text x="1180" y="1106" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="2" fill="none" stroke="#E9E5DC" stroke-width="1">ARCHIVE</text>
  <text x="1160" y="1154" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">the mark at zero density</text>

  <line x1="80" y1="1184" x2="1520" y2="1184" stroke="#2A2E36" stroke-width="1"/>

  <!-- 04 registers + accent -->
  <text x="80" y="1224" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#8B857B">04 — THE THREE ERA REGISTERS · DISCRETE, HARD-BOUNDARIED, APPLIED AT NAMED DATES · NEVER A GRADIENT</text>

  <rect x="80" y="1246" width="460" height="76" fill="#1A1712" stroke="#2A2E36" stroke-width="1"/>
  <text x="100" y="1284" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="1.5" fill="#E9E5DC">1856–1959 · PLATE</text>
  <text x="100" y="1306" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">first register</text>

  <rect x="560" y="1246" width="460" height="76" fill="#16233F" stroke="#2A2E36" stroke-width="1"/>
  <text x="580" y="1284" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="1.5" fill="#E9E5DC">1960–1999 · VAT</text>
  <text x="580" y="1306" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#C3C7CF">second register · indigo, grounded in adire</text>

  <rect x="1040" y="1246" width="460" height="76" fill="#0D0F14" stroke="#2A2E36" stroke-width="1"/>
  <text x="1060" y="1284" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="1.5" fill="#E9E5DC">2000–2026 · CARRIER</text>
  <text x="1060" y="1306" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">third register — the page's own ground</text>

  <text x="80" y="1350" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">A CONTINUOUS TIME BAR WOULD BE DECORATION. IT IS BANNED BY THIS DIRECTION'S OWN COLOUR RULE.</text>

  <rect x="80" y="1366" width="60" height="12" fill="#E0523B"/>
  <text x="156" y="1376" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">SIGNAL OXIDE #E0523B — THE PRESENT MARKER ONLY: THE AXIS END, THE LIVE INDICATOR, THE FOCUS RING.</text>
  <text x="156" y="1400" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8B857B">COLOUR IS DENSITY, NOT HUE — ONE INK AT FOUR DOT DENSITIES CARRIES THE ENTIRE SYSTEM.</text>

  <line x1="80" y1="1440" x2="1520" y2="1440" stroke="#2A2E36" stroke-width="1"/>
  <text x="80" y="1470" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8B857B">Specimen, not final artwork. Structure and behaviour only — no archival imagery, no gradients, no green, no second ink.</text>
</svg>
