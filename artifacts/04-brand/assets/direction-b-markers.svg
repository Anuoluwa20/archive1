  <line x1="656" y1="937" x2="672" y2="937" stroke="#C08F35" stroke-width="1"/>
  <text x="688" y="760" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#C08F35">347</text>
