  <!-- 03 colour rule -->
  <text x="80" y="1062" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#918B7E">03 — COLOUR IS ARCHITECTURAL, NOT CATEGORICAL</text>
  <text x="80" y="1088" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" fill="#918B7E">ONE ACCENT FOR THE WHOLE BUILDING. FOUR CATEGORY COLOURS IS HOW THE CARD-GRID MUSEUM TEMPLATE HAPPENS.</text>
  <rect x="80" y="1100" width="60" height="12" fill="#C08F35"/>
  <text x="156" y="1111" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#918B7E">BENIN BRONZE · THE ONLY ACCENT · CITED: EMOKPAE 1973</text>

  <line x1="80" y1="1130" x2="1520" y2="1130" stroke="#302A22" stroke-width="1"/>
  <text x="80" y="1152" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#918B7E">Specimen, not final artwork. A void that is not labelled is not a void — it is a bug. Test: can a reader tell deliberate absence from a broken image in two seconds?</text>
</svg>
