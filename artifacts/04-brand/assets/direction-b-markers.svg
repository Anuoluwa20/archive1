  <text x="1030" y="690" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#D9D3C7">Hairstyles — project begun 1968</text>

  <text x="790" y="720" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">MAKER</text>
  <text x="1030" y="720" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#D9D3C7">J.D. 'Okhai Ojeikere (1930-2014)</text>

  <text x="790" y="750" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">HOLDING</text>
  <text x="1030" y="750" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#D9D3C7">The Metropolitan Museum of Art</text>

