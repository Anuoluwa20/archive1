  <text x="1030" y="780" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#D9D3C7">542418</text>

  <text x="790" y="810" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">RIGHTS</text>
  <text x="1030" y="810" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#C08F35">Not public domain — not reproduced</text>

