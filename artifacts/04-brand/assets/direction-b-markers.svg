<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160" role="img" aria-labelledby="tB2 dB2">
  <title id="tB2">ARCHIVE — Direction B, The Absent Object: marker and void system</title>
  <desc id="dB2">Marker specimen sheet. Shows the four exhibition rooms as numbered wayfinding markers, a fully specified void worked example with dimension lines, true aspect ratio and a complete wall label carrying object, date, series, maker, holding institution, accession number, rights status, credit line and confidence marker, and the rule that one accent serves the whole building because rooms are distinguished by number and scale rather than by a category colour. Structure only, not final artwork. The object named in the label is not reproduced. No archival imagery is used.</desc>
  <rect width="1600" height="1160" fill="#14120F"/>

  <text x="80" y="68" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="21" font-weight="700" letter-spacing="3" fill="#D9D3C7">DIRECTION B — THE ABSENT OBJECT · MARKERS</text>
  <text x="80" y="96" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="13" fill="#918B7E">Rooms, voids and labels. Structure and behaviour only. No archival imagery is used.</text>
  <line x1="80" y1="118" x2="1520" y2="118" stroke="#302A22" stroke-width="1"/>

  <!-- 01 rooms -->
  <text x="80" y="170" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#918B7E">01 — ROOMS · WAYFINDING · NUMBERED AND SCALED, NOT COLOURED</text>

  <text x="80" y="236" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="28" font-weight="700" fill="#C08F35">01</text>
  <text x="170" y="236" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="16" font-weight="700" letter-spacing="2.6" fill="#D9D3C7">PHOTOGRAPHY</text>
  <line x1="450" y1="227" x2="710" y2="227" stroke="#D9D3C7" stroke-opacity="0.3" stroke-width="1"/>
  <text x="760" y="236" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">THE PLATE ROOM · voids at true ratio, dimensioned</text>

  <text x="80" y="306" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="28" font-weight="700" fill="#C08F35">02</text>
  <text x="170" y="306" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="16" font-weight="700" letter-spacing="2.6" fill="#D9D3C7">MUSIC</text>
  <line x1="450" y1="297" x2="710" y2="297" stroke="#D9D3C7" stroke-opacity="0.3" stroke-width="1"/>
  <text x="760" y="306" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">THE LISTENING ROOM · the programme as spatial type</text>

  <text x="80" y="376" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="28" font-weight="700" fill="#C08F35">03</text>
  <text x="170" y="376" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="16" font-weight="700" letter-spacing="2.6" fill="#D9D3C7">FASHION</text>
  <line x1="450" y1="367" x2="710" y2="367" stroke="#D9D3C7" stroke-opacity="0.3" stroke-width="1"/>
  <text x="760" y="376" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">THE HANDLING TABLE · spec labels plus drawn diagrams</text>

  <text x="80" y="446" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="28" font-weight="700" fill="#C08F35">04</text>
  <text x="170" y="446" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="16" font-weight="700" letter-spacing="2.6" fill="#D9D3C7">DESIGN</text>
  <line x1="450" y1="437" x2="710" y2="437" stroke="#D9D3C7" stroke-opacity="0.3" stroke-width="1"/>
  <text x="760" y="446" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">THE POSTER WALL · largest type · one cleared image</text>

  <line x1="80" y1="496" x2="1520" y2="496" stroke="#302A22" stroke-width="1"/>

  <!-- 02 the void -->
  <text x="80" y="540" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#918B7E">02 — A VOID, SPECIFIED · TRUE ASPECT RATIO, DIMENSIONED, LABELLED</text>

