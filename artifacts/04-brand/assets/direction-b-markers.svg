  <rect x="760" y="590" width="760" height="347" fill="none" stroke="#D9D3C7" stroke-opacity="0.22" stroke-width="1"/>

  <text x="790" y="630" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">OBJECT</text>
  <text x="1030" y="630" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#D9D3C7">Untitled (Modern Suku)</text>

  <text x="790" y="660" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">DATE</text>
  <text x="1030" y="660" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#D9D3C7">1975</text>

