<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="800" fill="#ffffff"/>

  <!-- header -->
  <text x="40" y="46" font-size="22" font-weight="700" fill="#000">ARCHIVE — cultural/heritage branding anti-patterns</text>
  <text x="40" y="70" font-size="13" fill="#444">Schematic archetypes drawn by the brand-research agent. These are NOT the real logos — they are generic diagrams of the shapes to avoid.</text>
  <text x="40" y="88" font-size="13" fill="#444">Each panel names the real, citable reference for that archetype. See LOGO_RESEARCH.md §9.</text>
  <line x1="40" y1="104" x2="1140" y2="104" stroke="#000" stroke-width="1"/>

  <!-- Panel 1 : globe in a ring -->
  <g transform="translate(40,130)">
    <rect x="0" y="0" width="350" height="290" fill="none" stroke="#bbb"/>
    <g transform="translate(175,120)">
      <circle r="78" fill="none" stroke="#1b1b1b" stroke-width="3"/>
      <circle r="52" fill="none" stroke="#1b1b1b" stroke-width="2"/>
      <ellipse rx="24" ry="52" fill="none" stroke="#1b1b1b" stroke-width="2"/>
      <line x1="-52" y1="0" x2="52" y2="0" stroke="#1b1b1b" stroke-width="2"/>
      <line x1="-44" y1="-26" x2="44" y2="-26" stroke="#1b1b1b" stroke-width="1.5"/>
      <line x1="-44" y1="26" x2="44" y2="26" stroke="#1b1b1b" stroke-width="1.5"/>
      <path d="M-92,52 q92,64 184,0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
      <path d="M-100,64 q100,70 200,0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
    </g>
    <text x="14" y="238" font-size="13" font-weight="700" fill="#000">1. Globe in a ring, in a wreath</text>
    <text x="14" y="256" font-size="11.5" fill="#444">The single most reused mark in heritage and</text>
    <text x="14" y="270" font-size="11.5" fill="#444">culture branding. Ref: un.org/en/about-us/un-emblem-and-flag</text>
  </g>

  <!-- Panel 2 : continent in circles with rays -->
  <g transform="translate(410,130)">
    <rect x="0" y="0" width="350" height="290" fill="none" stroke="#bbb"/>
    <g transform="translate(175,118)">
      <circle r="80" fill="#e9e3d2" stroke="#1b1b1b" stroke-width="3"/>
      <circle r="62" fill="#cfd9c4" stroke="#1b1b1b" stroke-width="2"/>
      <path d="M0,-46 L26,-30 L30,-2 L18,26 L-4,46 L-26,28 L-32,2 L-22,-26 Z" fill="#b8952f" stroke="#1b1b1b" stroke-width="2"/>
      <g stroke="#1b1b1b" stroke-width="2">
        <line x1="0" y1="-46" x2="0" y2="-74"/>
        <line x1="30" y1="-36" x2="58" y2="-50"/>
        <line x1="-30" y1="-36" x2="-58" y2="-50"/>
        <line x1="34" y1="6" x2="64" y2="10"/>
        <line x1="-34" y1="6" x2="-64" y2="10"/>
        <line x1="14" y1="40" x2="30" y2="66"/>
        <line x1="-14" y1="40" x2="-30" y2="66"/>
      </g>
      <circle r="4" cx="0" cy="0" fill="#8c2f27"/>
    </g>
    <text x="14" y="238" font-size="13" font-weight="700" fill="#000">2. Continent silhouette, circled, haloed</text>
    <text x="14" y="256" font-size="11.5" fill="#444">Map-shape + rays/leaves + concentric rings.</text>
    <text x="14" y="270" font-size="11.5" fill="#444">Ref: en.wikipedia.org/wiki/African_Union (Emblem section)</text>
  </g>

  <!-- Panel 3 : green white green -->
  <g transform="translate(780,130)">
    <rect x="0" y="0" width="360" height="290" fill="none" stroke="#bbb"/>
    <g transform="translate(180,104)">
      <rect x="-90" y="-46" width="60" height="92" fill="#1f7a3f"/>
      <rect x="-30" y="-46" width="60" height="92" fill="#ffffff" stroke="#ddd"/>
      <rect x="30" y="-46" width="60" height="92" fill="#1f7a3f"/>
      <path d="M-14,58 h28 l-8,16 h-12 z" fill="#1f7a3f"/>
      <text x="0" y="90" font-size="14" text-anchor="middle" fill="#8c2f27" font-weight="700">UNITY</text>
    </g>
    <text x="14" y="238" font-size="13" font-weight="700" fill="#000">3. Green-white-green as decoration</text>
    <text x="14" y="256" font-size="11.5" fill="#444">The flag's torse colours reused as motif, ribbon or</text>
    <text x="14" y="270" font-size="11.5" fill="#444">divider. Ref: en.wikipedia.org/wiki/Coat_of_arms_of_Nigeria</text>
  </g>

  <!-- Panel 4 : pattern blocks -->
  <g transform="translate(40,440)">
    <rect x="0" y="0" width="350" height="290" fill="none" stroke="#bbb"/>
    <g transform="translate(46,40)">
      <g>
        <rect x="0" y="0" width="52" height="26" fill="#c9a227"/><rect x="52" y="0" width="52" height="26" fill="#8c2f27"/>
        <rect x="104" y="0" width="52" height="26" fill="#1b1b1b"/><rect x="156" y="0" width="52" height="26" fill="#1f7a3f"/>
        <rect x="208" y="0" width="52" height="26" fill="#c9a227"/>
        <rect x="0" y="26" width="26" height="26" fill="#1f7a3f"/><rect x="26" y="26" width="52" height="26" fill="#c9a227"/>
        <rect x="78" y="26" width="52" height="26" fill="#8c2f27"/><rect x="130" y="26" width="52" height="26" fill="#1b1b1b"/>
        <rect x="182" y="26" width="52" height="26" fill="#1f7a3f"/><rect x="234" y="26" width="26" height="26" fill="#c9a227"/>
        <rect x="0" y="52" width="52" height="26" fill="#1b1b1b"/><rect x="52" y="52" width="52" height="26" fill="#1f7a3f"/>
        <rect x="104" y="52" width="52" height="26" fill="#c9a227"/><rect x="156" y="52" width="52" height="26" fill="#8c2f27"/>
        <rect x="208" y="52" width="52" height="26" fill="#1b1b1b"/>
        <rect x="0" y="78" width="26" height="26" fill="#8c2f27"/><rect x="26" y="78" width="52" height="26" fill="#1b1b1b"/>
        <rect x="78" y="78" width="52" height="26" fill="#1f7a3f"/><rect x="130" y="78" width="52" height="26" fill="#c9a227"/>
        <rect x="182" y="78" width="52" height="26" fill="#8c2f27"/><rect x="234" y="78" width="26" height="26" fill="#1b1b1b"/>
      </g>
      <text x="130" y="140" font-size="12" text-anchor="middle" fill="#8c2f27" font-weight="700">generic "African" pattern</text>
    </g>
    <text x="14" y="238" font-size="13" font-weight="700" fill="#000">4. Pattern-block shorthand</text>
    <text x="14" y="256" font-size="11.5" fill="#444">Woven-strip logic reduced to wallpaper. Ref:</text>
    <text x="14" y="270" font-size="11.5" fill="#444">en.wikipedia.org/wiki/Kente_cloth (Production section)</text>
  </g>

  <!-- Panel 5 : faux tribal -->
  <g transform="translate(410,440)">
    <rect x="0" y="0" width="350" height="290" fill="none" stroke="#bbb"/>
    <g transform="translate(175,110)">
      <path d="M-56,-56 h112 l-12,34 h-88 z" fill="#8c2f27" stroke="#1b1b1b" stroke-width="2"/>
      <path d="M-70,-22 h140 l-16,30 h-108 z" fill="#c9a227" stroke="#1b1b1b" stroke-width="2"/>
      <path d="M-78,8 h156 l-10,22 h-136 z" fill="#1b1b1b"/>
      <path d="M-62,30 h124 l-22,30 h-80 z" fill="#8c2f27" stroke="#1b1b1b" stroke-width="2"/>
      <circle cx="-34" cy="-4" r="7" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
      <circle cx="34" cy="-4" r="7" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
      <path d="M-20,50 h40 l-8,18 h-24 z" fill="#1b1b1b"/>
    </g>
    <text x="14" y="238" font-size="13" font-weight="700" fill="#000">5. Faux-tribal mask device</text>
    <text x="14" y="256" font-size="11.5" fill="#444">Invented "tribal" geometry with no source, no maker,</text>
    <text x="14" y="270" font-size="11.5" fill="#444">no credit. Replace with a real, cited system (§8).</text>
  </g>

  <!-- Panel 6 : museum template -->
  <g transform="translate(780,440)">
    <rect x="0" y="0" width="360" height="290" fill="none" stroke="#bbb"/>
    <rect x="46" y="30" width="268" height="170" fill="#ded6c4"/>
    <rect x="46" y="30" width="268" height="16" fill="#c9c0ab"/>
    <rect x="62" y="62" width="120" height="10" fill="#8f8878"/>
    <rect x="62" y="80" width="90" height="10" fill="#8f8878"/>
    <rect x="62" y="112" width="70" height="72" fill="#b9b1a0"/>
    <rect x="146" y="112" width="70" height="72" fill="#b9b1a0"/>
    <rect x="230" y="112" width="70" height="72" fill="#b9b1a0"/>
    <text x="100" y="226" font-size="12" fill="#8c2f27" font-weight="700">beige · serif · grid-of-cards</text>
    <text x="14" y="256" font-size="13" font-weight="700" fill="#000">6. The standard museum template</text>
    <text x="14" y="274" font-size="11.5" fill="#444">Explicitly excluded by SKU §6 ("must avoid").</text>
  </g>
</svg>
