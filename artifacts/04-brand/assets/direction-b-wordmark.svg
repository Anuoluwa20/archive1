<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180" role="img" aria-labelledby="tB1 dB1">
  <title id="tB1">ARCHIVE — Direction B, The Absent Object: wordmark specimen</title>
  <desc id="dB1">Specimen sheet for one of three creative directions. Shows the ARCHIVE lockup inside a hairline exhibition frame with brass corner marks, the same lockup beside a measured void at true aspect ratio, size tests down to sixteen pixels, one-colour block behaviour, and three framing variants. Structure and behaviour only, not final artwork. Set in a system serif stack; the production face is Fraunces under the SIL Open Font License, set at wonk zero, soft zero and maximum optical size. No archival imagery is used.</desc>
  <rect width="1600" height="1180" fill="#14120F"/>

  <text x="80" y="68" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="21" font-weight="700" letter-spacing="3" fill="#D9D3C7">DIRECTION B — THE ABSENT OBJECT</text>
  <text x="80" y="96" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="13" fill="#918B7E">Wordmark specimen — structure and behaviour only. Production face: Fraunces (SIL OFL 1.1). Shown here in a system serif stack.</text>
  <line x1="80" y1="118" x2="1520" y2="118" stroke="#302A22" stroke-width="1"/>

  <!-- 01 primary lockup -->
  <text x="80" y="170" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#918B7E">01 — PRIMARY LOCKUP · HAIRLINE FRAME · SERIF DISPLAY</text>

  <rect x="80" y="210" width="900" height="300" fill="none" stroke="#D9D3C7" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M80,236 V210 H106" fill="none" stroke="#C08F35" stroke-width="2"/>
  <path d="M954,210 H980 V236" fill="none" stroke="#C08F35" stroke-width="2"/>
  <path d="M80,484 V510 H106" fill="none" stroke="#C08F35" stroke-width="2"/>
  <path d="M954,510 H980 V484" fill="none" stroke="#C08F35" stroke-width="2"/>

  <text x="130" y="400" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="130" letter-spacing="7" fill="#D9D3C7">ARCHIVE</text>
  <text x="130" y="452" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#918B7E">A DIGITAL MUSEUM OF NIGERIA'S CREATIVE HISTORY</text>

  <!-- void -->
  <text x="1060" y="196" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="2" fill="#918B7E">A VOID, MEASURED AND LABELLED</text>
  <rect x="1060" y="210" width="460" height="300" fill="#211E19" stroke="#D9D3C7" stroke-opacity="0.28" stroke-width="1"/>
  <text x="1290" y="336" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" fill="#D9D3C7" opacity="0.55">THIS FIELD IS THE WORK'S TRUE SIZE.</text>
  <text x="1290" y="362" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" fill="#D9D3C7" opacity="0.55">THE WORK IS NOT REPRODUCED.</text>
  <text x="1290" y="410" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#C08F35">HOLDING · ACCESSION · RIGHTS</text>

  <line x1="1060" y1="530" x2="1520" y2="530" stroke="#C08F35" stroke-width="1"/>
  <line x1="1060" y1="522" x2="1060" y2="538" stroke="#C08F35" stroke-width="1"/>
  <line x1="1520" y1="522" x2="1520" y2="538" stroke="#C08F35" stroke-width="1"/>
  <text x="1290" y="558" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#C08F35">460 × 300 — TRUE RATIO</text>

  <text x="80" y="558" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">FRAME AT 0.45 OPACITY · BRASS CORNER MARKS · THE FRAME IS THE ROOM</text>

  <line x1="80" y1="600" x2="1520" y2="600" stroke="#302A22" stroke-width="1"/>

  <!-- 03 size tests -->
  <text x="80" y="644" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#918B7E">02 — SIZE TESTS · ONE COLOUR · ALWAYS THE SAME TYPE</text>

  <text x="80" y="700" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="16" letter-spacing="1" fill="#D9D3C7">ARCHIVE</text>
  <text x="400" y="700" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#918B7E">16 PX · LABEL REGISTER FLOOR</text>

  <text x="80" y="756" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="34" letter-spacing="2" fill="#D9D3C7">ARCHIVE</text>
  <text x="400" y="756" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#918B7E">34 PX · SECTION SIGN</text>

  <text x="80" y="836" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="60" letter-spacing="4" fill="#D9D3C7">ARCHIVE</text>
  <text x="400" y="836" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#918B7E">60 PX · WALL TITLE</text>

  <line x1="80" y1="890" x2="1520" y2="890" stroke="#302A22" stroke-width="1"/>

  <!-- 04 framing variants -->
  <text x="80" y="934" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#918B7E">03 — FRAMING VARIANTS</text>

  <rect x="80" y="964" width="440" height="118" fill="none" stroke="#D9D3C7" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="112" y="1040" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="40" letter-spacing="3" fill="#D9D3C7">ARCHIVE</text>
  <text x="80" y="1108" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#918B7E">A · FULL FRAME — HERO, SPOTLIGHT</text>

  <line x1="560" y1="964" x2="1000" y2="964" stroke="#D9D3C7" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="560" y1="1082" x2="1000" y2="1082" stroke="#D9D3C7" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="592" y="1040" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="40" letter-spacing="3" fill="#D9D3C7">ARCHIVE</text>
  <text x="560" y="1108" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#918B7E">B · RULES ONLY — SECTION HEADS</text>

  <text x="1072" y="1040" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="40" letter-spacing="3" fill="#D9D3C7">ARCHIVE</text>
  <text x="1040" y="1108" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10" fill="#918B7E">C · NO FRAME — DENSE CONTEXTS, MOBILE</text>

  <line x1="80" y1="1140" x2="1520" y2="1140" stroke="#302A22" stroke-width="1"/>
  <text x="80" y="1164" font-family="'Space Mono','IBM Plex Mono',Consolas,'Courier New',monospace" font-size="11" fill="#918B7E">Specimen, not final artwork. Set Fraunces at WONK 0 / SOFT 0 / maximum optical size / weight 300-400. No archival imagery is used.</text>
</svg>
